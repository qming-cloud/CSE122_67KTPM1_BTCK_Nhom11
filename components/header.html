<header class="sticky top-0 w-full z-50 bg-white/95 backdrop-blur-md border-b-2 border-on-surface">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
    <!-- Brand -->
    <div class="flex items-center gap-6">
      <a class="flex items-center gap-2 group" href="#">
        <div
          class="w-10 h-10 rounded-xl flex items-center justify-center bg-white border-2 border-on-surface neo-shadow-sm group-hover:rotate-6 transition-transform overflow-hidden p-0.5">
          <!-- Thay đường dẫn logo của bạn vào src bên dưới -->
          <img src="logo.png" alt="Logo" class="w-full h-full object-contain" />
        </div>
        <div class="flex flex-col">
          <span class="font-extrabold text-2xl tracking-tight text-on-surface flex items-center gap-1">
            Skill<span class="text-primary-container">Swap</span>
            <!-- <span
              class="text-[10px] uppercase font-bold tracking-widest bg-yellow-300 text-on-surface px-1.5 py-0.5 rounded border border-on-surface">VN</span>
          </span> -->
        </div>
      </a>
      <!-- Menu Items -->
      <nav class="hidden lg:flex items-center gap-1">
        <a class="px-3.5 py-1.5 rounded-lg font-bold text-sm bg-primary/10 text-primary hover:bg-primary/20 transition-colors"
          href="#kham-pha">Khám Phá</a>
        <a class="px-3.5 py-1.5 rounded-lg font-bold text-sm text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors"
          href="#cach-hoat-dong">Cách Hoạt Động</a>
        <a class="px-3.5 py-1.5 rounded-lg font-bold text-sm text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors"
          href="#cap-doi-ky-nang">Cặp Đôi Kỹ Năng</a>
        <a class="px-3.5 py-1.5 rounded-lg font-bold text-sm text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors"
          href="#danh-muc">Kỹ Năng Hot</a>
        <a class="px-3.5 py-1.5 rounded-lg font-bold text-sm text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors"
          href="#cong-dong">Cộng Đồng</a>
      </nav>
    </div>
    <!-- Search & CTA Button -->
    <div class="flex items-center gap-3 flex-1 justify-end max-w-xl">
      <div class="relative flex-1 max-w-xs hidden md:block group">
        <div
          class="flex items-center w-full h-10 pl-3 pr-2.5 rounded-xl bg-surface-container-low border-2 border-on-surface shadow-[inset_0_2px_4px_rgba(0,0,0,0.06)] focus-within:border-primary focus-within:bg-white focus-within:ring-2 focus-within:ring-primary/20 transition-all duration-300">
          <span
            class="material-symbols-outlined text-outline group-focus-within:text-primary text-lg mr-2 select-none transition-colors">search</span>
          <input
            class="w-full bg-transparent text-xs font-semibold text-on-surface border-0 outline-none appearance-none focus:outline-none"
            placeholder="Tìm môn học, kỹ năng..." type="text" />
        </div>
      </div>

      <!-- Notification Bell -->
      <button
        class="relative group cursor-pointer focus:outline-none flex items-center justify-center w-10 h-10 rounded-xl hover:bg-surface-container transition-colors"
        onclick="openInboxModal()" title="Hộp thư đến">
        <span
          class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors text-[26px]">notifications</span>
        <span id="header-notification-dot"
          class="absolute top-1.5 right-1.5 w-3 h-3 bg-red-500 rounded-full border-2 border-white hidden animate-bounce"></span>
      </button>

      <div class="relative">
        <button class="relative group cursor-pointer focus:outline-none" onclick="handleAvatarClick(event)"
          title="Tài khoản">
          <div class="w-10 h-10 rounded-xl overflow-hidden border-2 border-on-surface neo-shadow-sm">
            <img id="header-avatar-img" alt="User avatar"
              class="w-full h-full object-cover opacity-50 grayscale transition-all duration-300"
              src="https://api.dicebear.com/7.x/notionists/svg?seed=Guest" />
          </div>
          <span id="header-online-dot"
            class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-slate-300 rounded-full border-2 border-white transition-colors duration-300"></span>
        </button>

        <!-- Avatar Dropdown Menu -->
        <div id="avatar-dropdown"
          class="absolute right-0 mt-2 w-56 bg-white border-2 border-on-surface rounded-xl neo-shadow-sm hidden flex-col overflow-hidden z-50 animate-slideUp">

          <!-- Logged In View -->
          <div id="dropdown-logged-in" class="hidden flex-col">
            <div class="px-4 py-3 border-b-2 border-on-surface/10 bg-surface-container-low">
              <p class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">Đang đăng nhập với</p>
              <p class="text-sm font-black text-on-surface truncate" id="dropdown-username">User</p>
            </div>
            <a href="#"
              class="px-4 py-3 text-sm font-bold text-on-surface hover:bg-surface-container transition-colors flex items-center gap-2">
              <span class="material-symbols-outlined text-lg">person</span> Trang cá nhân
            </a>
            <a href="#"
              class="px-4 py-3 text-sm font-bold text-on-surface hover:bg-surface-container transition-colors flex items-center gap-2">
              <span class="material-symbols-outlined text-lg">settings</span> Cài đặt
            </a>
            <button onclick="handleLogout(event)"
              class="w-full text-left px-4 py-3 text-sm font-black text-red-600 hover:bg-red-50 hover:text-red-700 transition-colors flex items-center gap-2 border-t-2 border-on-surface/10">
              <span class="material-symbols-outlined text-lg">logout</span> Đăng xuất
            </button>
          </div>

          <!-- Guest View -->
          <div id="dropdown-guest" class="hidden flex-col p-3">
            <div class="mb-3 text-center">
              <p class="text-sm font-bold text-on-surface">Bạn chưa đăng nhập</p>
            </div>
            <a href="login.html"
              class="w-full text-center block px-4 py-2.5 bg-primary text-white font-bold text-sm rounded-lg border border-on-surface neo-shadow-sm hover:translate-y-px hover:neo-shadow-none transition-all mb-2">Đăng
              Nhập</a>
            <a href="login.html"
              class="w-full text-center block px-4 py-2 bg-surface text-on-surface border border-outline-variant font-bold text-sm rounded-lg hover:bg-surface-container transition-colors">Đăng
              Ký Mới</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
